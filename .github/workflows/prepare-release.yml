name: Prepare release

# Run manually on the default branch. Bumps the version in pyproject.toml,
# moves CHANGELOG.md [Unreleased] into a dated section and opens a PR.
# After merging, tag the merge commit.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump (ignored if an exact version is given)
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Exact version, e.g. 1.2.0rc1 (no leading v)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Bump version, update changelog, open PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push branch
      pull-requests: write # open PR
      actions: write # start CI; GITHUB_TOKEN pushes trigger nothing
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require default branch
        if: github.ref_name != github.event.repository.default_branch
        env:
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          echo "::error::run on $DEFAULT"
          exit 1
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Bump version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          EXACT: ${{ inputs.version }}
        run: |
          read_version() {
            python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          }
          current=$(read_version)
          EXACT=${EXACT#v}
          if [ -z "$EXACT" ]; then
            uv version --bump "$BUMP" --frozen
          elif [ "$EXACT" != "$current" ]; then # equal: first release, not yet tagged
            uv version "$EXACT" --frozen # uv rejects non-PEP 440
          fi
          new=$(read_version)
          # refuse to go backwards (PEP 440 order)
          uv run --no-project --quiet --with packaging python - "$current" "$new" <<'EOF'
          import sys
          from packaging.version import Version
          old, new = map(Version, sys.argv[1:])
          sys.exit(f"{new} < current {old}" if new < old else 0)
          EOF
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$new" --silent 2>/dev/null; then
            echo "::error::tag v$new already exists"
            exit 1
          fi
          echo "pyproject.toml: $current -> $new"
          echo "version=$new" >> "$GITHUB_OUTPUT"

      - name: Update CHANGELOG.md
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: python .github/scripts/changelog.py release "$VERSION"

      - name: Push branch and open PR
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          BASE: ${{ github.ref_name }}
        run: |
          branch="release/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Release v$VERSION"
          gh auth setup-git
          git push origin "$branch"
          {
            echo "Release v$VERSION."
            echo
            python .github/scripts/changelog.py notes "$VERSION"
            echo
            echo "After merging, tag to publish:"
            echo
            echo '```bash'
            echo "git switch $BASE && git pull && git tag -a v$VERSION -m v$VERSION && git push origin v$VERSION"
            echo '```'
          } > pr-body.md
          gh pr create --base "$BASE" --head "$branch" --title "Release v$VERSION" --body-file pr-body.md
          gh workflow run ci.yml --ref "$branch"
