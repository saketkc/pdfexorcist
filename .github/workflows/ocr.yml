name: OCR

# Opt-in OCR engines on CPU; manual or weekly, never blocking.
# PaddleOCR downloads models at run time; no runner has a GPU for chandra.
on:
  workflow_dispatch:
    inputs:
      paddle:
        description: Also run the slow PaddleOCR regression tests
        type: boolean
        default: false
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  UV_PYTHON_PREFERENCE: only-system

jobs:
  tesseract:
    name: Tesseract smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-poppler
      - name: Install tesseract
        run: sudo apt-get install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: ocr
      - run: uv pip install -e .
      - run: tesseract --version
      - name: OCR smoke test
        run: python .github/scripts/ocr_smoke.py tests/fixtures/cii/cii_2021_1A.1_p43.pdf

  paddle:
    name: PaddleOCR + Tesseract tests (advisory)
    if: github.event_name == 'schedule' || inputs.paddle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-poppler
      - name: Install tesseract
        run: sudo apt-get install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: paddle
      - name: Install
        run: |
          uv pip install -e ".[paddleocr]" pytest
          # PaddleOCR needs opencv-contrib-python as the only cv2 wheel
          uv pip uninstall opencv-python opencv-python-headless || true
          uv pip install --reinstall --no-deps opencv-contrib-python==4.10.0.84
      - name: OCR regression tests
        env:
          PDFEXORCIST_OCR_TESTS: "1"
        run: python -m pytest -q tests/test_adsi_state_table.py tests/test_bmc_lake_report.py -ra --junitxml=reports/junit.xml
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-ocr-paddle
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
