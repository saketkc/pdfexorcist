# pdfexorcist recipe: ICMR AMRSN tables printed as pictures, read by OCR
#
# Some reports paste tables as Excel screenshots: most of 2018, and chapters 2-3 of 2019-2022.
# The text layer has the captions of these tables, but not the numbers.
# recipe.toml reads all the other tables.
# This recipe reads the pictures with three OCR engines and two table models, GLM-OCR and OXR.
# It reads the lines from each "Table N" caption to the next figure. Each line is a row.
# The models give table cells without word boxes. Their tables get the captions from the text layer.
# Give it the pages with picture tables. "python amrsn_pictures.py report.pdf" prints them.
# Use -j 1. Apple Vision reads nothing while another engine uses the GPU.
# 2020 Table 3.2:
#
#   pdfexorcist extract https://www.icmr.gov.in/icmrobject/custom_data/pdf/resource-guidelines/AMRSN_annual_report_2020_1.pdf --pages 71 --recipe amrsn/pictures.toml
#
# On the fixture:
#
#   pdfexorcist extract tests/fixtures/amrsn/amrsn_pictures.pdf --recipe pdfexorcist/recipes/amrsn/pictures.toml

name = "ICMR AMRSN picture tables"
description = "AMRSN tables pasted as pictures, read by OCR (docTR, Indra, Apple Vision, GLM-OCR, OXR)"
sample = "../../../tests/fixtures/amrsn/amrsn_pictures.pdf"

[engines]
# One vote each. tesseract reads the data bars as marks, so it is not used.
use = ["doctr", "indra", "ocrmac", "glmocr", "oxr"]
# A tie stays unresolved. In the blurred 2018 pictures the word-box engines fuse cells;
# there the two models are often the only readers to agree.
min_agree = 2

[parser]
type = "custom"
function = "amrsn_pictures.py:parse"
key = ["page", "table", "row", "col", "field"]  # field: "value", or "pct" under an R/n count

[postprocess]
# Only GLM-OCR reads the vertical headings of 2018. See name_columns.
function = "amrsn_pictures.py:name_columns"

[output]
layout = "table"
rows = ["page", "title", "row", "label", "col", "column"]  # row: the row key; column: the headings over it ("ward / %s")
columns = "field"
format = "csv"
